[package]
name = "tui-core"
description = "Terminal UI core: an animated reticle, nvim navigation, and a redraw loop."
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/roest1/tui-core"

[dependencies]
crossterm = "0.29"
libc = "0.2"
base64 = "0.23"

# The event loop, driven through a real pty. It runs ITSELF as the child, so it
# has its own `main` rather than the standard harness. See the header of the file.
[[test]]
name = "pty"
harness = false
